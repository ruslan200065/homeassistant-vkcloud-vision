name: "Validate"

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  hassfest:
    name: "With hassfest"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: "With HACS validation"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: brands

  license:
    name: "With License Eye Header"
    runs-on: "ubuntu-latest"
    steps:
      - uses: apache/skywalking-eyes@v0.7.0
        with:
          mode: check

  tests:
    name: "Home Assistant ${{ matrix.home-assistant }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - home-assistant: "2025.12.5"
            python: "3.13"
            av: "16.0.1"
            turbojpeg: "1.8.0"
          - home-assistant: "2026.11.1"
            python: "3.14"
            av: "19.0.0"
            turbojpeg: "1.8.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          python -m pip install "homeassistant==${{ matrix.home-assistant }}"
          "Pillow>=11.2.1" "av==${{ matrix.av }}" "PyTurboJPEG==${{ matrix.turbojpeg }}"
          "numpy==2.3.2" "ha-ffmpeg==3.2.2" pytest pytest-asyncio
      - run: python -m pytest -q -o asyncio_default_fixture_loop_scope=function
